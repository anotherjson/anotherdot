# Claude Code statusline — rendered by Starship with solarized_osaka theme

format = """
$os\
$sudo\
$directory\
${env_var.CLAUDE_MODEL_ICON}\
${env_var.CLAUDE_CTX_GREEN}\
${env_var.CLAUDE_CTX_YELLOW}\
${env_var.CLAUDE_CTX_RED}\
${env_var.CLAUDE_RATE}\
${env_var.CLAUDE_COST}\
${env_var.CLAUDE_SESSION}\
$git_branch\
$git_status"""

palette = 'solarized_osaka'

# --- System ---
[os]
disabled = false
style = "fg:color_fg"

[sudo]
format = "[ $symbol]($style)"
style = "bold italic color_purple"
symbol = "⋈┈"
disabled = false

[directory]
home_symbol = "⌂"
read_only = " 󰌾"
style = "bold fg:color_fg"
format = "[$path]($style)[⎪ ](bold fg:color_fg)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# --- Git ---

[git_branch]
style = "italic color_blue"
format = " [$symbol $branch(:$remote_branch)]($style)"
symbol = "[](bold italic color_blue)"

[git_status]
style = "bold color_blue"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic color_magenta)"
ahead = "[▴│[${count}](bold white)│](italic color_green)"
behind = "[▿│[${count}](bold white)│](italic color_red)"
diverged = "[◇ ▴┤[${ahead_count}](regular color_white)│▿┤[${behind_count}](regular color_white)│](italic color_magenta)"
untracked = "[◌◦](italic color_yellow)"
stashed = "[◃◈](italic color_white)"
modified = "[●◦](italic color_yellow)"
staged = "[▪┤[$count](bold color_white)│](italic color_aqua)"
renamed = "[◎◦](italic color_blue)"
deleted = "[✕](italic color_red)"

# --- Claude env_var modules ---

[env_var.CLAUDE_MODEL_ICON]
format = "[$env_value ](dimmed color_aqua)"

[env_var.CLAUDE_CTX_GREEN]
format = "[c:${env_value}%](dimmed color_green) "

[env_var.CLAUDE_CTX_YELLOW]
format = "[c:${env_value}%](dimmed color_yellow) "

[env_var.CLAUDE_CTX_RED]
format = "[c:${env_value}%](bold color_red) "

[env_var.CLAUDE_RATE]
format = "[r:${env_value}% ](dimmed color_yellow)"

[env_var.CLAUDE_COST]
format = "[$env_value ](dimmed color_blue)"

[env_var.CLAUDE_SESSION]
format = "[\\[$env_value\\]](dimmed color_fg)"

# --- Solarized Osaka palette (copied from main starship.toml) ---
