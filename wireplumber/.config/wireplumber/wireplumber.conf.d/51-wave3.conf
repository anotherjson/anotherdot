# Wave:3 microphone fix — disable the auto-created playback sink and rename the
# capture node so wavedevicefix.lua can force mic capture to start before
# playback. Without this the Wave:3 silences the mic whenever it is also used
# for output (a long-standing Wave 1/3/XLR firmware quirk on Linux).
#
# Originally from https://github.com/jmansar/wavexlr-on-linux-cfg (cfg1, MIT).
# This is our own local copy maintained in this dotfiles repo — intentionally
# NOT tracked against upstream.

wireplumber.components = [
  {
    name = wavedevicefix.lua,
    type = script/lua,
    provides = custom.wave3fix,
    arguments = { device = "wave3" }
  }
]

wireplumber.profiles = {
  main = {
    custom.wave3fix = required
  }
}

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Elgato_Systems_Elgato_Wave_3_*"
      }
    ]
    actions = {
      update-props = {
        # TEMP (2026-06-09): stock Wave:3 output re-enabled because the custom
        # wave3-sink isn't being created this boot. Revert to `true` once the
        # wavedevicefix null-sink/forcing-link chain is fixed. `git checkout` me.
        node.disabled = false
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Elgato_Systems_Elgato_Wave_3_*"
      }
    ]
    actions = {
      update-props = {
        node.name = "wave3-source"
      }
    }
  }
]
