# Theme for the hyprtoolkit apps (hyprlauncher, hyprpwcenter, hyprshutdown, hyprpolkitagent).
# Flat hyprlang table; colours follow solarized_osaka.conf (names in the comments).
# https://wiki.hypr.land/hypr-ecosystem/user/hyprtoolkit/

background       = rgb(00141A)   # base04x
base             = rgb(002B36)   # base03x
alternate_base   = rgb(073642)   # base02x
text             = rgb(ADB8B8)   # base001
bright_text      = rgb(FDF6E3)   # base003
accent           = rgb(268BD2)   # blue500
accent_secondary = rgb(2AA198)   # cyan500

font_family           = FiraCode Nerd Font
font_family_monospace = FiraCode Nerd Font Mono
font_size             = 11
small_font_size       = 10
h1_size               = 19
h2_size               = 15
h3_size               = 13

rounding_large = 10
rounding_small = 5
