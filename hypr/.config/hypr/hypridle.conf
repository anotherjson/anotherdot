general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener { 
#     # timeout = 150                                          # 2.5min.
#     timeout = 1700                                          # 2.5min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 600                                  # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 660                                                      # 11min
    on-timeout = hyprctl dispatch dpms off                            # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend-then-hibernate # suspend now, hibernate after ~2h
    # hypridle counts only Wayland input as activity, so ssh work never resets
    # its timer. The guard defers instead; hypridle retries it every 60s and
    # drops the pending retry by itself as soon as real input arrives.
    # Wrapped so a missing, non-executable or broken guard exits 0 and lets the
    # suspend through -- only a literal exit 1 defers. Never being able to
    # suspend is the worse failure.
    condition_cmd = G=$HOME/.config/hypr/scripts/ssh-idle-guard.sh; [ -f "$G" ] && [ -x "$G" ] || exit 0; "$G"; [ $? = 1 ] && exit 1; exit 0
    condition_retry = 60
}

# Hard ceiling: 1800 + 7200. Unconditioned, so it suspends 2h after the guard
# first deferred no matter what ssh is doing -- a permanently-connected -N
# tunnel or VS Code Remote-SSH would otherwise defer forever. Also arms when no
# ssh exists at all, so a box woken without input (RTC, WoL) re-suspends here.
listener {
    timeout = 9000                                # 2.5h
    on-timeout = systemctl suspend-then-hibernate
}
